name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push to a PR branch fires both the `push` and `pull_request`
# events. The event name is part of the concurrency group so those
# two runs stay independent — the branch-push run (unit only) and the
# PR run (unit + e2e) no longer cancel each other, while a newer push
# still supersedes its own older run of the same event type.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run test:run

  e2e:
    name: Integration tests
    runs-on: ubuntu-latest
    # Run e2e only on pull requests and on pushes to main — not on
    # every push to every branch. The suite serializes through one
    # shared Supabase project (see the job-level concurrency below),
    # so enqueuing it on all ~60 active branches' pushes built a deep
    # queue: a ~5-minute job could sit 15+ minutes waiting its turn.
    # PR branches still get full e2e coverage via the pull_request
    # event on every push; unit tests still run on every branch push.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    # The e2e suite seeds and mutates ONE shared Supabase project, so
    # only one e2e job across the whole repo may run at a time —
    # otherwise concurrent runs on different branches stomp each
    # other's seed data and produce flaky mass failures. This group is
    # a separate, repo-wide scope from the per-branch workflow group
    # above. cancel-in-progress is false so a queued run waits its turn
    # rather than killing the run ahead of it.
    concurrency:
      group: e2e-shared-supabase
      cancel-in-progress: false
    # Caps a hung run (e.g. a wedged dev server or deadlocked test)
    # instead of letting it sit until GitHub's 6-hour default.
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E_TEST_PASSWORD intentionally not set — the password is hardcoded
      # in scripts/seed.ts (E2E_MAIN_USER_PASSWORD) so the seeded DB state
      # and the login attempt in auth.setup.ts cannot drift apart.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Create .env.local from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" >> .env.local

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
