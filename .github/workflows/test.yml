name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# A push to a PR branch fires both the `push` and `pull_request`
# events, which previously launched two e2e jobs that hammered the
# same shared Supabase project at once — exhausting its auth/API rate
# limits and producing flaky, non-deterministic failures. The `push`
# event has an empty `head_ref` while `pull_request` sets it to the
# source branch, so keying the group on `head_ref || ref_name`
# collapses both events for a branch into one group; cancelling the
# older run then guarantees a single e2e job per branch at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run test:run

  e2e:
    name: Integration tests
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # E2E_TEST_PASSWORD intentionally not set — the password is hardcoded
      # in scripts/seed.ts (E2E_MAIN_USER_PASSWORD) so the seeded DB state
      # and the login attempt in auth.setup.ts cannot drift apart.
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Create .env.local from secrets
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env.local
          echo "E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}" >> .env.local

      - run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
